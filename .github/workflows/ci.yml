name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        working-directory: backend
        run: npm run lint || true

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint || true

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

  # Deploy backend to Render only on main branch
  deploy-backend:
    name: Deploy Backend to Render
    needs: [backend-lint-test, frontend-lint-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://wear-out.onrender.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: Render-Deployments/render-deploy-action@v1
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

  # Deploy frontend to Netlify only on main branch
  deploy-frontend:
    name: Deploy Frontend to Netlify
    needs: [frontend-lint-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://wearout.shop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Netlify Deploy
        uses: nwtg8/actions-netlify@v3
        with:
          publish-dir: frontend/dist
          production-deploy: true
          publish-site: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}