<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wear Out — Premium Streetwear | Wear Your Confidence</title>
    <meta name="description" content="Wear Out — Pakistan's boldest streetwear brand. Shop premium shirts, trousers, caps, shoes & unstitched fabric. Cash on delivery. Bold fits, clean lines, unapologetic confidence." />
    <meta name="keywords" content="streetwear Pakistan, premium clothing Pakistan, buy shirts online Pakistan, trousers Pakistan, caps Pakistan, shoes Pakistan, unstitched fabric Pakistan, COD Pakistan, bold fashion Pakistan, urban clothing Pakistan, Wear Out, oversized shirts, cargo pants, snapback caps, sneakers Pakistan, mens fashion Pakistan, womens fashion Pakistan" />
    <meta name="author" content="Wear Out" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wear Out — Premium Streetwear | Wear Your Confidence" />
    <meta property="og:description" content="Pakistan's boldest streetwear brand. Premium shirts, trousers, caps, shoes & unstitched fabric. Cash on delivery available." />
    <meta property="og:image" content="https://wearout.shop/assets/logo.webp" />
    <meta property="og:url" content="https://wearout.shop" />
    <meta property="og:site_name" content="Wear Out" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wear Out — Premium Streetwear" />
    <meta name="twitter:description" content="Pakistan's boldest streetwear brand. Premium shirts, trousers, caps, shoes & unstitched fabric." />
    <meta name="twitter:image" content="https://wearout.shop/assets/logo.webp" />

    <!-- Canonical -->
    <link rel="canonical" href="https://wearout.shop" />

    <!-- JSON-LD Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Wear Out",
      "url": "https://wearout.shop",
      "logo": "https://wearout.shop/assets/logo.webp",
      "description": "Pakistan's boldest streetwear brand. Premium shirts, trousers, caps, shoes & unstitched fabric.",
      "sameAs": [
        "https://www.facebook.com/wearout.shop",
        "https://www.instagram.com/wearout.shop",
        "https://tiktok.com/@wearout.shop"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": ["English", "Urdu"]
      }
    }
    </script>

    <!-- JSON-LD WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Wear Out",
      "url": "https://wearout.shop",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://wearout.shop/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
